<main>

<section>

    <h1>Contact Me</h1>

    <p class="about">

        Feel free to contact me using the form below.

    </p>

</section>


<section>

<form id="contactForm">


    <div class="form-group">

        <label for="name">
            Name
        </label>

        <input
            type="text"
            id="name"
            name="name"
            placeholder="Enter your name">

    </div>


    <div class="form-group">

        <label for="email">
            Email
        </label>

        <input
            type="email"
            id="email"
            name="email"
            placeholder="Enter your email">

    </div>


    <div class="form-group">

        <label for="subject">
            Subject
        </label>

        <input
            type="text"
            id="subject"
            name="subject"
            placeholder="Enter subject">

    </div>


    <div class="form-group">

        <label>
            Preferred Contact Method
        </label>

        <input
            type="radio"
            id="emailContact"
            name="contactMethod"
            value="email">

        <label for="emailContact">
            Email
        </label>


        <input
            type="radio"
            id="phoneContact"
            name="contactMethod"
            value="phone">

        <label for="phoneContact">
            Phone
        </label>

    </div>


    <div class="form-group">

        <label for="message">
            Message
        </label>

        <textarea
            id="message"
            name="message"
            placeholder="Enter your message">
        </textarea>

    </div>


    <div class="form-group">

        <input
            type="checkbox"
            id="updates"
            name="updates">

        <label for="updates">
            I would like to receive updates.
        </label>

    </div>


    <button type="submit">
        Send Message
    </button>


</form>

</section>
